[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-api"
version = "0.1.0"
description = "分层 FastAPI Web 工程"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
    "cryptography>=45,<49",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["migrations/versions"]
